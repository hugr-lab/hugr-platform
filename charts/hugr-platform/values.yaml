# The hugr platform's chart (spec 005). One release per namespace: the namespace is the platform's alone (spec 001),
# and the cluster-scoped objects are named after it. Prerequisites in the cluster: cert-manager and its csi-driver. No
# credential belongs in these values - a database login lives in tresor, a key in its key source.

# The CRDs (HugrPlatform, HugrNodeGroup) are in crds/: Helm installs them before anything else, skips them when the
# cluster has them (another platform's release), and never upgrades or deletes them. A chart whose CRDs changed is
# applied first: kubectl apply --server-side -f <the chart>/crds, then helm upgrade.

operator:
  image:
    repository: ghcr.io/hugr-lab/hugr-platform
    tag: "" # default: the chart's appVersion
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}

# The platform's internal CA and its Issuer (hugr-internal) are this namespace's own, so only a pod or a Certificate of
# this namespace is issued from them (spec 001's boundary). The CA issues the operator's certificate and the doors'
# (the csi-driver, per pod).
internalCA:
  # a TLS Secret of this namespace with the CA's tls.crt and tls.key, when the organisation brings its own internal
  # CA; empty: the chart makes one (a self-signed root)
  existingSecret: ""
  duration: 87600h # the made root's life

# The CA bundle the nodes trust (HUGR_CA_FILE replaces their system roots for httpfs) and the front and the console
# verify the nodes by: the operator writes it - the public roots of its image, the internal CA, and these ConfigMaps of
# the namespace (an IdP's or a database's private CA) - into the ConfigMap hugr-ca-bundle.
caBundle:
  extra: [] # [{name: corp-ca, key: ca.crt}]

# The console's public certificate (spec 003), for the names people reach it by. issuerRef: the organisation's
# issuer for them; empty: the internal CA. Or secretName: a TLS Secret the installer brings (then nothing is issued).
console:
  enabled: true
  dnsNames: []
  ipAddresses: []
  issuerRef: {}
  secretName: ""

# The front's public certificate (spec 002), the same way.
front:
  dnsNames: []
  ipAddresses: []
  issuerRef: {}
  secretName: ""

# spec 001, Security: the ValidatingAdmissionPolicies that let a group's pods come only from the operator's chain
# (Kubernetes 1.30+)
admissionPolicies:
  enabled: false

# The HugrPlatform, its spec as written (api/v1alpha1). The chart fills caBundle with the operator's bundle and the
# front's certificate when they are left unset.
platform:
  name: hugr
  spec:
    node:
      image: ghcr.io/hugr-lab/hugr-node:v0.2.0
      # what the release says of that image (spec 008): its DuckDB release, and the policy catalog's schema its build
      # reads and writes and the oldest build that reads what it writes. An upgrade checks the repository and orders
      # the catalog's migration by them; change them with the image.
      duckdbVersion: v2.0.0
      catalogSchema: 22
      catalogMinReader: 21
    idp:
      issuer: "" # required
    tresor:
      host: "" # required: tresor-server's host:port
    repository:
      prefix: "" # required: the nodes' extension repository (the in-cluster kista)
    front: {}
    # The policy the first node writes into a catalog nobody administers yet (spec 005, hugr-node spec 015) - names
    # only, never SQL nor a secret. It needs console: the console's client (console.clientID, for
    # console.audiences.nodes) is always one of its clients, and its resource groups are the groups'.
    #   firstPolicy:
    #     issuer: {name: corp, rolesClaim: roles}   # url: default idp.issuer; audiences: besides the console's
    #     clients: [{name: dbeaver, clientID: "..."}] # optional: tools' applications besides the console
    #     administrators: hugr-admins                 # the roles claim's value of the platform's administrators
    #     defaultGroup: etl                           # optional: the resource group of a principal bound to none
    sizes: {}
    plan:
      maxNodes: 0
      sizes: []

# hugr-init, the install Job (spec 005): makes the policy catalog's database and its login (a generated password that
# goes to tresor only), writes the login into tresor as platform.spec.catalog.secret, grants it to the groups'
# identities, and deletes the database administrator's one-time Secret. A hook ahead of the first groups; a run again
# (post-upgrade) only grants. tresor-server (0.7.0+) trusts the cluster's ServiceAccount issuer for it and lists
# client:system:serviceaccount:<this namespace>:hugr-init among its administrators.
hugrInit:
  enabled: false
  tresor:
    url: "" # tresor-server's base, https (its discovery is <url>/.well-known/duckdb-secrets)
    audience: duckdb-secrets # the audience of the cluster issuer's entry in tresor-server's config
    grants: [] # the groups' identities in tresor, given use of the secret: role:... or group:...
  catalog:
    engine: postgres # PostgreSQL 18 or later
    host: ""
    port: 5432
    database: hugr
    login: hugr_catalog
    sslmode: verify-full # disable | require | verify-ca | verify-full (the platform's CA bundle verifies)
    # the database administrator's credential (username, password): a Secret of this namespace the installer makes
    # once; the Job deletes it after use
    adminSecret: hugr-init-db-admin
    adminDatabase: postgres
  backoffLimit: 3
  activeDeadlineSeconds: 900
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

# The first node groups, created once, at install (post-install hooks, after the operator - whose webhook judges a
# group - is ready: install with --wait): an upgrade never touches them, so a scale made in the console or with kubectl
# stays, and they stay when the release goes. tls defaults to a certificate the csi-driver issues into each pod from
# the internal CA.
#   - name: etl
#     spec: {replicas: 2, size: large, identity: {clientID: "..."}, doors: {quack: true}}
groups: []
groupCertificateDuration: 720h
