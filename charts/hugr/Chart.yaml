apiVersion: v2
name: hugr
description: >-
  The hugr platform for a catalog's one-chart install (hugr-platform spec 005): the platform (hugr-platform), given its
  secrets service (tresor-server), its extension repository (kista) and its policy catalog's database - or, by a flag
  each, running light ones of its own
type: application
version: 0.1.0
appVersion: "dev"
kubeVersion: ">=1.29.0-0"
home: https://github.com/hugr-lab/hugr-platform
sources:
  - https://github.com/hugr-lab/hugr-platform
dependencies:
  # this repository's chart, packaged with this one at the release's version
  - name: hugr-platform
    version: ">=0.0.0-0"
    repository: file://../hugr-platform
  # its own tresor and kista, only when no address is given and install says so (spec 005 step 3)
  - name: tresor-server
    alias: tresor
    version: 0.7.3
    repository: oci://ghcr.io/hugr-lab/charts
    condition: install.tresor
  - name: kista
    version: 0.1.4
    repository: oci://ghcr.io/hugr-lab/charts
    condition: install.kista
