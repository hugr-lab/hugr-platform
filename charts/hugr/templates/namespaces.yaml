{{/* The own parts' namespaces (spec 005): each in its own - tresor holds credentials, kista a signing key, the
database the catalog - so the platform's namespace administrator is not theirs. Kept when the release goes, with their
volumes. */}}
{{- range $svc, $ns := include "hugr.umbrella.services" . | fromYaml }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "hugr.umbrella.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svc }}
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
