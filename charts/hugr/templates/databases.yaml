{{/* tresor's and kista's databases (spec 005): hugr-init --phase databases makes each one's login and database on the
PostgreSQL server and writes the password into a Secret of the service's namespace, which the service's pods wait
for. A Job of the release (not a hook: the services become ready only once it has run, and Helm waits for them before
any post-install hook), named after the revision so an upgrade runs it again - a run with the Secrets there makes
nothing. The catalog's database is hugr-init's second phase (the platform's chart), once tresor serves. */}}
{{- $g := .Values.global }}
{{- $platform := index .Values "hugr-platform" }}
{{/* the parent sees only what its own values set for the platform: hugr-platform's defaults written out */}}
{{- $image := (($platform.operator).image) | default dict }}
{{- $catalog := (($platform.hugrInit).catalog) | default dict }}
{{- $sa := "hugr-init-db" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hugr.umbrella.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- range $svc, $ns := include "hugr.umbrella.services" . | fromYaml }}
---
# the service's database password: read whether it is there, made when it is not (create cannot be narrowed to a
# name; the Job runs once per install or upgrade, under this account of its own)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hugr-init-db
  namespace: {{ $ns }}
  labels:
    {{- include "hugr.umbrella.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ printf "%s-db" $svc | quote }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hugr-init-db
  namespace: {{ $ns }}
  labels:
    {{- include "hugr.umbrella.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: hugr-init-db}
subjects:
  - {kind: ServiceAccount, name: {{ $sa }}, namespace: {{ $.Release.Namespace }}}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hugr-init-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hugr.umbrella.labels" . | nindent 4 }}
data:
  config.yaml: |
    tresor:
      url: {{ tpl $platform.hugrInit.tresor.url . | quote }}
      tokenFile: /var/run/secrets/hugr-init/tresor/token
      # the database's private CA (this phase reaches no tresor); empty: the image's roots verify it
      caFile: {{ if $g.database.caCert }}/etc/hugr-ca/database.crt{{ else }}""{{ end }}
      grants: {{ required "hugr-platform.hugrInit.tresor.grants names the groups' identities in tresor" $platform.hugrInit.tresor.grants | toJson }}
    catalog:
      secret: {{ default "hugr_policy_catalog" (($platform.platform.spec).catalog).secret | quote }}
      engine: postgres
      host: {{ $g.database.host | quote }}
      port: {{ $g.database.port }}
      database: {{ default "hugr" $catalog.database | quote }}
      login: {{ default "hugr_catalog" $catalog.login | quote }}
      sslmode: {{ $g.database.sslmode | quote }}
      admin:
        secretName: {{ $g.database.adminSecret | quote }}
        dir: /var/run/secrets/hugr-init/db-admin
        database: {{ $g.database.adminDatabase | quote }}
    services:
      {{- range $svc, $ns := include "hugr.umbrella.services" . | fromYaml }}
      - name: {{ $svc }}
        database: {{ $svc }}
        login: {{ $svc }}
        secret: {namespace: {{ $ns }}, name: {{ printf "%s-db" $svc }}, key: password}
      {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hugr-init-db-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hugr.umbrella.labels" . | nindent 4 }}
    app.kubernetes.io/component: init
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "hugr.umbrella.labels" . | nindent 8 }}
        app.kubernetes.io/component: init
    spec:
      serviceAccountName: {{ $sa }}
      automountServiceAccountToken: true # the Secrets of the services' namespaces
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: hugr-init
          image: {{ printf "%s:%s" (default "ghcr.io/hugr-lab/hugr-platform" $image.repository) (default .Chart.AppVersion $image.tag) }}
          imagePullPolicy: {{ default "IfNotPresent" $image.pullPolicy }}
          command: [/hugr-init, --phase, databases, --config, /etc/hugr-init/config.yaml]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/hugr-init, readOnly: true}
            - {name: ca, mountPath: /etc/hugr-ca, readOnly: true}
            - {name: db-admin, mountPath: /var/run/secrets/hugr-init/db-admin, readOnly: true}
      volumes:
        - name: config
          configMap: {name: hugr-init-db}
        - name: ca
          configMap: {name: hugr-private-cas}
        # optional: the catalog phase deletes it after the first install, and an upgrade's run finds the services'
        # Secrets there and needs no administrator
        - name: db-admin
          secret: {secretName: {{ $g.database.adminSecret | quote }}, optional: true}
