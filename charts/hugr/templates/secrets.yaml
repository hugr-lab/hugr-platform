{{/* The own parts' secrets (spec 005 step 3), made once by hugr-init (its secrets phase): the own tresor's KEK, the own
kista's channel key (RSA-2048, which Helm cannot make) and the own database's superuser - with that one's copy as the
catalog phase's one-time administrator Secret. Each goes into a Secret of its part's namespace, and an existing one is
never replaced. A Job of the release, not a hook: the parts' pods wait for their Secrets, and Helm's release record
holds none of them. */}}
{{- if or .Values.install.tresor .Values.install.kista .Values.install.catalogDatabase }}
{{- $g := .Values.global }}
{{- $parts := list }}
{{- if .Values.install.tresor }}{{- $parts = append $parts (list $g.namespaces.tresor "tresor-kek") }}{{- end }}
{{- if .Values.install.kista }}{{- $parts = append $parts (list $g.namespaces.kista "kista-channel-key") }}{{- end }}
{{- if .Values.install.catalogDatabase }}{{- $parts = append $parts (list $g.namespaces.database "postgres-superuser") }}{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hugr-init-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hugr.umbrella.labels" . | nindent 4 }}
    app.kubernetes.io/component: init
automountServiceAccountToken: true
{{- range $parts }}
---
# its Secret, by name; create cannot be narrowed to a name
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hugr-init-secrets
  namespace: {{ index . 0 }}
  labels:
    {{- include "hugr.umbrella.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ index . 1 }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hugr-init-secrets
  namespace: {{ index . 0 }}
  labels:
    {{- include "hugr.umbrella.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: hugr-init-secrets}
subjects:
  - {kind: ServiceAccount, name: hugr-init-secrets, namespace: {{ $.Release.Namespace }}}
{{- end }}
{{- if .Values.install.catalogDatabase }}
---
# the catalog phase's one-time administrator Secret, a copy of the own database's superuser
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hugr-init-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hugr.umbrella.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $g.database.adminSecret }}]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hugr-init-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hugr.umbrella.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: hugr-init-secrets}
subjects:
  - {kind: ServiceAccount, name: hugr-init-secrets, namespace: {{ .Release.Namespace }}}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hugr-init-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hugr.umbrella.labels" . | nindent 4 }}
data:
  secrets.yaml: |
    {{- if .Values.install.tresor }}
    tresorKEK: {namespace: {{ $g.namespaces.tresor }}, name: tresor-kek, key: {{ .Values.tresor.localKEK.key }}}
    {{- end }}
    {{- if .Values.install.kista }}
    kistaKey: {namespace: {{ $g.namespaces.kista }}, name: kista-channel-key, key: channel}
    {{- end }}
    {{- if .Values.install.catalogDatabase }}
    database:
      superuser: {namespace: {{ $g.namespaces.database }}, name: postgres-superuser}
      admin: {namespace: {{ .Release.Namespace }}, name: {{ $g.database.adminSecret }}}
      username: postgres
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # one per revision: a Job's template cannot change, and an upgrade runs it again (it makes nothing twice)
  name: hugr-init-secrets-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hugr.umbrella.labels" . | nindent 4 }}
    app.kubernetes.io/component: init
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "hugr.umbrella.labels" . | nindent 8 }}
        app.kubernetes.io/component: init
    spec:
      serviceAccountName: hugr-init-secrets
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: hugr-init
          image: {{ include "hugr.umbrella.operatorImage" . }}
          imagePullPolicy: {{ (index .Values "hugr-platform").operator.image.pullPolicy }}
          command: [/hugr-init, --phase, secrets, --config, /etc/hugr-init/secrets.yaml]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.secrets.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/hugr-init, readOnly: true}
      volumes:
        - name: config
          configMap: {name: hugr-init-secrets}
{{- end }}
