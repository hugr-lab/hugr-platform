{{/* hugr-init's openbao phase (keys.mode internal): the first run initialises OpenBao (one recovery key, kept in the
Secret openbao-recovery of its namespace) and configures it with the root token it then revokes; every later run - a
Job per revision, so an upgrade runs it again - logs in by Kubernetes auth as its own role and makes what the release
asks for. The keys, the services' policies (each its key's use, nothing more) and their roles bound to tresor's and
kista's ServiceAccounts. No token outlives a run. */}}
{{- if eq .Values.global.keys.mode "internal" }}
{{- $ns := .Values.global.namespaces.openbao }}
{{- $v := .Values.global.keys.vault }}
{{- $platform := index .Values "hugr-platform" }}
{{- $image := (($platform.operator).image) | default dict }}
{{- $sa := "hugr-openbao-init" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "hugr.umbrella.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# the recovery key's Secret: read whether it is there, written once (create cannot be narrowed to a name), replaced
# only for an OpenBao made anew
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "hugr.umbrella.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [openbao-recovery]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "hugr.umbrella.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $sa }}}
subjects:
  - {kind: ServiceAccount, name: {{ $sa }}, namespace: {{ $ns }}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "hugr.umbrella.labels" . | nindent 4 }}
data:
  config.yaml: |
    openbao:
      url: {{ printf "https://openbao.%s.svc:8200" $ns | quote }}
      caFile: /etc/hugr-ca/vault.crt
      tokenFile: /var/run/secrets/hugr-init/openbao/token
      namespace: {{ $ns | quote }}
      recoverySecret: openbao-recovery
      transitMount: {{ $v.transitMount | quote }}
      authMount: {{ $v.authMount | quote }}
      audience: {{ $v.audience | quote }}
      init: {role: {{ $sa | quote }}, serviceAccount: {{ $sa | quote }}}
      services:
        - name: {{ $v.kistaRole | quote }}
          use: sign
          key: {{ $v.kistaKey | quote }}
          serviceAccount: {{ include "hugr.umbrella.kistaFullname" . | quote }}
          namespace: {{ .Values.global.namespaces.kista | quote }}
        - name: {{ $v.tresorRole | quote }}
          use: kek
          key: {{ $v.tresorKey | quote }}
          serviceAccount: {{ .Values.tresor.fullnameOverride | quote }}
          namespace: {{ .Values.global.namespaces.tresor | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $sa }}-{{ .Release.Revision }}
  namespace: {{ $ns }}
  labels:
    {{- include "hugr.umbrella.labels" . | nindent 4 }}
    app.kubernetes.io/component: init
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "hugr.umbrella.labels" . | nindent 8 }}
        app.kubernetes.io/component: init
    spec:
      serviceAccountName: {{ $sa }}
      automountServiceAccountToken: true # the recovery key's Secret
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: hugr-init
          image: {{ printf "%s:%s" (default "ghcr.io/hugr-lab/hugr-platform" $image.repository) (default .Chart.AppVersion $image.tag) }}
          imagePullPolicy: {{ default "IfNotPresent" $image.pullPolicy }}
          command: [/hugr-init, --phase, openbao, --config, /etc/hugr-init/config.yaml]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/hugr-init, readOnly: true}
            - {name: ca, mountPath: /etc/hugr-ca, readOnly: true}
            - {name: token, mountPath: /var/run/secrets/hugr-init/openbao, readOnly: true}
      volumes:
        - name: config
          configMap: {name: {{ $sa }}}
        # OpenBao's CA (vault.crt), the umbrella's
        - name: ca
          secret: {secretName: hugr-cas}
        # its login into OpenBao: bound to the Kubernetes auth's audience, good for OpenBao only
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ $v.audience | quote }}
                  expirationSeconds: 600
{{- end }}
