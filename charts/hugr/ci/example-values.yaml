# The example the umbrella is linted and rendered with: one platform given its parts - an external tresor-server,
# kista and PostgreSQL (the default, spec 005 step 3); own-values.yaml runs them itself
global:
  tresor:
    host: tresor.example.net:443
  repository:
    prefix: https://kista.example.net/hugr/platform
  database:
    host: hugr-pg.example.net
  idp:
    issuer: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0
    audience: api://hugr
    tresorAudience: api://tresor
    tresorScope: api://tresor/.default
  clusterIssuer:
    url: https://kubernetes.default.svc.cluster.local
  duckdbVersion: v2.0.0
hugr-platform:
  console:
    dnsNames: [console.hugr.example]
  front:
    dnsNames: [hugr.example]
  platform:
    spec:
      node: {image: ghcr.io/hugr-lab/hugr-node:v0.2.0}
      front: {replicas: 2}
      console:
        clientID: hugr-console
        audiences: {nodes: api://hugr, tresor: api://tresor}
      firstPolicy:
        issuer: {name: corp, rolesClaim: roles}
        administrators: hugr-admins
      sizes:
        large:
          resources:
            requests: {cpu: "8", memory: 32Gi}
            limits: {memory: 32Gi}
          temp: {medium: local, size: 200Gi}
      plan: {maxNodes: 6, sizes: [large]}
  hugrInit:
    tresor:
      grants: [role:hugr_node]
    door:
      audience: 00000000-0000-0000-0000-00000000a001 # Entra: the nodes' API's client id
      scopes: ["quack:console.hugr.example:443", "quack:hugr.example:9494"]
      grants: [role:hugr-admins]
  groups:
    - name: etl
      spec: {replicas: 2, size: large, identity: {clientID: 00000000-0000-0000-0000-000000000001}}
