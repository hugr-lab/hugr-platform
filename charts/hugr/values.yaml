# The hugr platform (hugr-platform spec 005, the umbrella). Its parts - tresor-server (the secrets service), kista (the
# extension repository) and the policy catalog's PostgreSQL server - are external by default, named by their address:
# products of their own, each installed by its own recipe, possibly shared by several platforms. A part with no address
# is run by the umbrella only when install says so, as a light one: one replica, its state on a volume, its keys in a
# Secret of its namespace. For anything wider, install the product by its own recipe and give its address here.
# No credential belongs in these values: the database administrator's comes once in a Secret hugr-init deletes, and the
# own parts' secrets are made once by hugr-init in their namespaces.
# Prerequisites in the cluster: cert-manager and its csi-driver.

# What the umbrella runs itself - one place for it (spec 005 step 3): each part not named here is given by its address
# under global
install:
  tresor: false
  kista: false
  catalogDatabase: false

global:
  # the own parts' namespaces; the umbrella makes them, and keeps them (and their volumes) when the release goes
  namespaces:
    tresor: hugr-tresor     # install.tresor
    kista: hugr-kista       # install.kista
    database: hugr-database # install.catalogDatabase

  # An external tresor-server: its host:port (the platform's spec.tresor.host; https). It must trust the cluster's
  # ServiceAccount issuer for hugr-init and list hugr-init among its administrators (hugr-init writes the catalog's
  # secret there): subject:<clusterIssuer.url>|system:serviceaccount:<this release's namespace>:hugr-init
  tresor:
    host: "" # or install.tresor
    caCert: "" # its CA when private, PEM: the platform's bundle takes it

  # An external kista: the https prefix of the platform's channel (<kista>/<tenant>/<channel>), serving the node's
  # DuckDB (duckdbVersion)
  repository:
    prefix: "" # or install.kista
    caCert: ""

  # The policy catalog's PostgreSQL server (18 or later): hugr-init makes the catalog's database and login there, with
  # the administrator's credential - a Secret of the release's namespace (username, password) the installer makes once,
  # deleted after use (with install.catalogDatabase hugr-init makes it)
  database:
    host: "" # or install.catalogDatabase
    port: 5432
    sslmode: verify-full
    adminSecret: hugr-init-db-admin
    adminDatabase: postgres
    caCert: "" # the server's CA when private, PEM

  # The organisation's IdP: people's tokens (the console, tools) and the nodes' workload identity. The platform's own
  # use of it (the console's client, the first policy's issuer) is hugr-platform.platform.spec's; the tresor* facts
  # are its own tresor's (install.tresor)
  idp:
    issuer: "" # required, https
    # the IdP's CA when it is private (a Keycloak of the organisation's), PEM; empty: the system roots
    caCert: ""
    # tresor's audience (its tokens for the secrets service) and the claims it reads roles and groups from
    tresorAudience: ""
    tresorRolesClaim: roles
    tresorGroupsClaim: "" # groups (Keycloak); empty: none
    # the claim tresor reads a service's (a node's) identity from: azp (Keycloak), appid or azp (Entra)
    tresorServiceClaim: azp
    # the scope a node asks for tresor's token, if the IdP needs one (Entra: api://<tresor>/.default)
    tresorScope: ""

  # The cluster's ServiceAccount issuer (kubectl get --raw /.well-known/openid-configuration): hugr-init logs in to
  # tresor with its projected token. private: the API server's own issuer (kind, a self-managed cluster) - an own tresor
  # reads its discovery with its own token and the cluster's CA; false for a public one (AKS, EKS, GKE)
  clusterIssuer:
    url: "" # required
    private: true

  # The installer's statement that the cluster encrypts Secrets at rest: an own kista keeps its channel key in a
  # Secret, and refuses that without it (kista spec 0026)
  etcdEncryptionAtRest: false

  # The node's DuckDB version (the platform's hugr-node image's): the channel serves extensions for it - a release
  # (v2.0.0) or the commit a node was built on (a dev version, which no upstream mirrors). The release pins the node
  # image and its DuckDB together (spec 008): change one, change the other
  duckdbVersion: v2.0.0

# --- the platform (hugr-platform's values, as its chart documents them) -------------------------------------------
hugr-platform:
  internalCA: {}
  platform:
    name: hugr
    spec:
      node:
        # the node the release pins, its DuckDB global.duckdbVersion (hugr-node v0.2.0: DuckDB v2.0.0); its catalog
        # schema (catalogSchema, catalogMinReader) is hugr-platform's value of the same release
        image: ghcr.io/hugr-lab/hugr-node:v0.2.0
        duckdbVersion: "{{ .Values.global.duckdbVersion }}"
      idp:
        issuer: "{{ .Values.global.idp.issuer }}"
      # the given tresor, or the own one
      tresor:
        host: >-
          {{ default (printf "tresor.%s.svc:443" .Values.global.namespaces.tresor) .Values.global.tresor.host }}
        scope: "{{ .Values.global.idp.tresorScope }}"
      # the given channel, or the own kista's
      repository:
        name: hugr
        prefix: >-
          {{ default (printf "https://%s-kista.%s.svc/hugr/platform" .Release.Name .Values.global.namespaces.kista) .Values.global.repository.prefix }}
      catalog: {secret: hugr_policy_catalog}
      sizes: {}
      plan: {maxNodes: 0, sizes: []}
  # the own parts' CAs and the given parts' and the IdP's private ones (the umbrella's ConfigMaps), into the
  # platform's bundle
  caBundle:
    extra:
      - {name: hugr-services-ca, key: ca.crt}
      - {name: hugr-private-cas, key: tresor.crt}
      - {name: hugr-private-cas, key: repository.crt}
      - {name: hugr-private-cas, key: database.crt}
      - {name: hugr-private-cas, key: idp.crt}
  hugrInit:
    enabled: true
    tresor:
      url: >-
        https://{{ default (printf "tresor.%s.svc" .Values.global.namespaces.tresor) .Values.global.tresor.host }}
      grants: [] # required: the groups' identities in tresor (role:… or group:…)
    catalog:
      host: >-
        {{ default (printf "postgres.%s.svc" .Values.global.namespaces.database) .Values.global.database.host }}
      sslmode: "{{ .Values.global.database.sslmode }}"
      adminSecret: hugr-init-db-admin
  groups: []

# --- its own tresor-server (install.tresor; its values, config rendered through tpl) --------------------------------
# One replica, its state on SQLite on a volume, its KEK in a Secret hugr-init makes once (tresor-kek). For more,
# install tresor-server by its own recipe and give global.tresor.host.
tresor:
  # tresor-server 0.7.3: config rendered through tpl (its spec 028) - a literal {{ there is written {{ "{{" }}; the
  # certificate cert-manager renews read again in service (its spec 029)
  configTemplate: true
  namespaceOverride: hugr-tresor # = global.namespaces.tresor (checked)
  fullnameOverride: tresor
  tlsSecret: tresor-tls
  service: {port: 443}
  clusterIssuer: {enabled: true} # = global.clusterIssuer.private (checked)
  sqlite: {size: 1Gi}
  localKEK: {secretName: tresor-kek, key: key}
  extraVolumes:
    - {name: cas, secret: {secretName: hugr-cas}}
  extraVolumeMounts:
    - {name: cas, mountPath: /var/run/tresor/cas, readOnly: true}
  config:
    public_url: "https://tresor.{{ .Values.global.namespaces.tresor }}.svc"
    state: {kind: sqlite}
    issuers:
      - issuer: "{{ .Values.global.idp.issuer }}"
        audience: "{{ .Values.global.idp.tresorAudience }}"
        roles_claim: "{{ .Values.global.idp.tresorRolesClaim }}"
        groups_claim: "{{ .Values.global.idp.tresorGroupsClaim }}"
        ca_file: "{{ if .Values.global.idp.caCert }}/var/run/tresor/cas/idp.crt{{ end }}"
        service: {claim: "{{ .Values.global.idp.tresorServiceClaim }}"}
        service_flows: [client_credentials, private_key_jwt, federated]
      - issuer: "{{ .Values.global.clusterIssuer.url }}"
        audience: duckdb-secrets
        # a private issuer (the API server's): read with tresor's own token, by the cluster's CA; none for a public one
        ca_file: "{{ if .Values.global.clusterIssuer.private }}/var/run/tresor/cluster/ca.crt{{ end }}"
        discovery_token_file: "{{ if .Values.global.clusterIssuer.private }}/var/run/tresor/cluster/token{{ end }}"
        service: {claim: kubernetes.io, client_claim: sub}
    policy:
      # hugr-init, by its subject (beside another issuer, a client: name could be that issuer's client of the name);
      # a list of your own keeps this entry (checked)
      admins:
        - "subject:{{ .Values.global.clusterIssuer.url }}|system:serviceaccount:{{ .Release.Namespace }}:hugr-init"
      # the nodes act for their sessions: an actor per group's identity, client:<its client id at the IdP>
      actors: []

# --- its own kista (install.kista; its values, config rendered through tpl) -----------------------------------------
# One replica, its store and blobs on SQLite on one volume, the channel's key in a Secret hugr-init makes once
# (kista-channel-key: RSA-2048, kista's kubesecret source - global.etcdEncryptionAtRest is the installer's statement it
# requires). For more, install kista by its own recipe and give global.repository.prefix.
kista:
  # kista 0.1.4 (its spec 0025): each string of config holding {{ rendered by tpl, within the string; one rendering
  # empty is refused
  configTemplate: true
  namespaceOverride: hugr-kista # = global.namespaces.kista (checked)
  mode: tls
  tlsSecret: kista-tls
  service: {type: ClusterIP}
  blobVolume: {enabled: true, accessMode: ReadWriteOnce, size: 20Gi}
  secretVolumes:
    - {name: signing, secretName: kista-channel-key, mountPath: /etc/kista/signing}
  config:
    serve: {public_url: "https://{{ .Release.Name }}-kista.{{ .Values.namespaceOverride }}.svc"}
    store: {kind: sqlite}
    signers:
      sources:
        - name: keys
          kind: kubesecret
          allow: [channel]
          # the umbrella renders this only with global.etcdEncryptionAtRest (checked): the installer's statement
          kubesecret: {dir: /etc/kista/signing, etcd_encryption_at_rest: true}
    # the first setup, once (kista spec 0020 4a, 0024): the tenant, the platform's channel for the node's DuckDB,
    # its key, and the upstreams it mirrors
    bootstrap:
      versions:
        # a DuckDB release is a vX.Y.Z tag; a node built on a commit of DuckDB's runs a dev version
        - version: "{{ .Values.global.duckdbVersion }}"
          kind: >-
            {{ if regexMatch "^v[0-9]+[.][0-9]+[.][0-9]+$" .Values.global.duckdbVersion }}release{{ else }}dev{{ end }}
      tenant: {name: hugr}
      channels:
        - name: platform
          kind: signed
          versions: ["{{ .Values.global.duckdbVersion }}"]
          key: "keys:channel"
      upstreams: []

# --- its own catalog database (install.catalogDatabase) -------------------------------------------------------------
# One PostgreSQL 18 pod in global.namespaces.database: a StatefulSet with a volume, TLS from a CA of its namespace,
# its superuser's password made once by hugr-init (postgres-superuser). For more, run a server of your own (a managed
# one, an operator's) and give global.database.host.
catalogDatabase:
  image: {repository: postgres, tag: "18", pullPolicy: IfNotPresent}
  storage: {size: 10Gi, storageClass: ""}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}

# --- hugr-init's secrets phase: the own parts' secrets, made once -------------------------------------------------
secrets:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
