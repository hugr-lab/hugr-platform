# The hugr platform with its services (hugr-platform spec 005, the umbrella): the platform in the release's namespace,
# tresor-server and kista each in a namespace of its own. An install's facts are written once, under global; the
# services' values below read them (their charts render config through tpl). No credential belongs in these values:
# the database administrator's comes once in a Secret hugr-init deletes, the services' own logins are made at install.
# Prerequisites in the cluster: cert-manager and its csi-driver, and a PostgreSQL 18 server (external, for now).

global:
  # the services' namespaces; the umbrella makes them, and keeps them (and their volumes) when the release goes
  namespaces:
    tresor: hugr-tresor
    kista: hugr-kista

  # The PostgreSQL server (18 or later) of the policy catalog, tresor's state and kista's store: each gets a database
  # and a login of its own, made by hugr-init with the administrator's credential - a Secret of the release's
  # namespace (username, password) the installer makes once, deleted after use
  database:
    host: "" # required
    port: 5432
    sslmode: verify-full # tresor refuses less off its own machine
    adminSecret: hugr-init-db-admin
    adminDatabase: postgres
    # the server's CA when it is private, PEM (public: no credential): the platform's bundle and the services take it;
    # empty: the system roots
    caCert: ""

  # The organisation's IdP: people's tokens (the console, tools) and the nodes' workload identity
  idp:
    issuer: "" # required, https
    # the audience of the people's tokens for the nodes (the console's client asks for it)
    audience: ""
    # the claim that carries a person's roles: roles (Entra ID), realm_access.roles (Keycloak)
    rolesClaim: roles
    # tresor's audience (its tokens for the secrets service) and the claim it reads roles from
    tresorAudience: ""
    tresorRolesClaim: roles
    # the claim tresor reads a service's (a node's) identity from: azp (Keycloak), appid or azp (Entra)
    tresorServiceClaim: azp
    # the scope a node asks for tresor's token, if the IdP needs one (Entra: api://<tresor>/.default)
    tresorScope: ""

  # The cluster's ServiceAccount issuer (kubectl get --raw /.well-known/openid-configuration): hugr-init logs in to
  # tresor with its projected token. private: the API server's own issuer (kind, a self-managed cluster) - tresor reads
  # its discovery with its own token and the cluster's CA; false for a public one (AKS, EKS, GKE)
  clusterIssuer:
    url: "" # required
    private: true

  # The key store: kista's channel key and tresor's KEK. external: the organisation's HashiCorp Vault or OpenBao,
  # Transit keys and Kubernetes-auth roles the organisation made for kista's and tresor's ServiceAccounts. internal
  # (OpenBao in the cluster) and secret come in later steps (spec 005)
  keys:
    mode: external
    vault:
      address: "" # https://vault.example:8200
      # the vault's CA when it is private, PEM; empty: the system roots
      caCert: ""
      transitMount: transit
      # the Transit keys: kista signs its channel with one, tresor wraps its data keys with the other
      kistaKey: hugr-channel
      tresorKey: hugr-tresor
      # the Kubernetes auth: its mount and the roles bound to kista's and tresor's ServiceAccounts; the audience of
      # the tokens the services present to it
      authMount: kubernetes
      kistaRole: kista
      tresorRole: tresor
      audience: vault

  # The node's DuckDB version (the platform's hugr-node image's): kista's channel serves extensions for it
  duckdbVersion: ""

# --- the platform (hugr-platform's values, as its chart documents them) -------------------------------------------
hugr-platform:
  internalCA: {}
  platform:
    name: hugr
    spec:
      node:
        image: "" # required: ghcr.io/hugr-lab/hugr-node:<tag>
      idp:
        issuer: "{{ .Values.global.idp.issuer }}"
      tresor:
        host: "tresor.{{ .Values.global.namespaces.tresor }}.svc:443"
        scope: "{{ .Values.global.idp.tresorScope }}"
      repository:
        name: hugr
        prefix: "https://{{ .Release.Name }}-kista.{{ .Values.global.namespaces.kista }}.svc/hugr/platform"
      catalog: {secret: hugr_policy_catalog}
      sizes: {}
      plan: {maxNodes: 0, sizes: []}
  # tresor's and kista's CAs and the database's private one (the umbrella's ConfigMaps), into the platform's bundle
  caBundle:
    extra: [{name: hugr-services-ca, key: ca.crt}, {name: hugr-database-ca, key: ca.crt}]
  hugrInit:
    enabled: true
    tresor:
      url: "https://tresor.{{ .Values.global.namespaces.tresor }}.svc"
      grants: [] # required: the groups' identities in tresor (role:… or group:…)
    catalog:
      host: "{{ .Values.global.database.host }}"
      sslmode: "{{ .Values.global.database.sslmode }}"
      adminSecret: hugr-init-db-admin
  groups: []

# --- tresor-server (its values; config rendered through tpl) -------------------------------------------------------
tresor:
  namespaceOverride: hugr-tresor # = global.namespaces.tresor (checked)
  fullnameOverride: tresor
  replicas: 2
  tlsSecret: tresor-tls
  clusterIssuer: {enabled: true} # = global.clusterIssuer.private (checked)
  vaultToken: {enabled: true, audience: vault} # = global.keys.vault.audience (checked)
  extraVolumes:
    - {name: db, secret: {secretName: tresor-db}}
    - {name: cas, secret: {secretName: hugr-cas}}
  extraVolumeMounts:
    - {name: db, mountPath: /var/run/tresor/db, readOnly: true}
    - {name: cas, mountPath: /var/run/tresor/cas, readOnly: true}
  config:
    public_url: "https://tresor.{{ .Values.global.namespaces.tresor }}.svc"
    state:
      kind: postgres
      dsn: >-
        host={{ .Values.global.database.host }} port={{ .Values.global.database.port }} dbname=tresor user=tresor
        sslmode={{ .Values.global.database.sslmode }}{{ if .Values.global.database.caCert }}
        sslrootcert=/var/run/tresor/cas/database.crt{{ end }}
      auth: password
      password_file: /var/run/tresor/db/password
    keys: {kind: vault, key: "{{ .Values.global.keys.vault.tresorKey }}"}
    vault:
      address: "{{ .Values.global.keys.vault.address }}"
      ca_file: "{{ if .Values.global.keys.vault.caCert }}/var/run/tresor/cas/vault.crt{{ end }}"
      auth: {method: kubernetes, mount: "{{ .Values.global.keys.vault.authMount }}", role: "{{ .Values.global.keys.vault.tresorRole }}"}
    issuers:
      - issuer: "{{ .Values.global.idp.issuer }}"
        audience: "{{ .Values.global.idp.tresorAudience }}"
        roles_claim: "{{ .Values.global.idp.tresorRolesClaim }}"
        service: {claim: "{{ .Values.global.idp.tresorServiceClaim }}"}
        service_flows: [client_credentials, private_key_jwt, federated]
      - issuer: "{{ .Values.global.clusterIssuer.url }}"
        audience: duckdb-secrets
        # a private issuer (the API server's): read with tresor's own token, by the cluster's CA; none for a public one
        ca_file: "{{ if .Values.global.clusterIssuer.private }}/var/run/tresor/cluster/ca.crt{{ end }}"
        discovery_token_file: "{{ if .Values.global.clusterIssuer.private }}/var/run/tresor/cluster/token{{ end }}"
        service: {claim: kubernetes.io, client_claim: sub}
    policy:
      # hugr-init, by its subject (beside another issuer, a client: name could be that issuer's client of the name)
      admins:
        - "subject:{{ .Values.global.clusterIssuer.url }}|system:serviceaccount:{{ .Release.Namespace }}:hugr-init"
      # the nodes act for their sessions: an actor per group's identity, client:<its client id at the IdP>
      actors: []

# --- kista (its values; config rendered through tpl) ---------------------------------------------------------------
kista:
  namespaceOverride: hugr-kista # = global.namespaces.kista (checked)
  mode: tls
  tlsSecret: kista-tls
  replicas: 1
  service: {type: ClusterIP}
  # the fs blob domain on one volume: one replica at a time (an object store for more, see kista's docs)
  blobVolume: {enabled: true, accessMode: ReadWriteOnce, size: 50Gi}
  secretVolumes:
    - {name: db, secretName: kista-db, mountPath: /etc/kista/secrets/db}
    - {name: cas, secretName: hugr-cas, mountPath: /etc/kista/secrets/cas}
  projectedTokens:
    - {name: vault, mountPath: /var/run/secrets/kista/vault, audience: vault, expirationSeconds: 3600} # audience = global.keys.vault.audience (checked)
  config:
    serve: {public_url: "https://{{ .Release.Name }}-kista.{{ .Values.global.namespaces.kista }}.svc"}
    store:
      kind: postgres
      dsn: >-
        host={{ .Values.global.database.host }} port={{ .Values.global.database.port }} dbname=kista user=kista
        sslmode={{ .Values.global.database.sslmode }}{{ if .Values.global.database.caCert }}
        sslrootcert=/etc/kista/secrets/cas/database.crt{{ end }}
      login: {kind: password, password_file: /etc/kista/secrets/db/password}
    blob:
      domains:
        - {name: default, kind: fs, fs: {root: /var/lib/kista/blobs}}
    signers:
      sources:
        - name: keys
          kind: vault
          allow: ["{{ .Values.global.keys.vault.kistaKey }}"]
          vault:
            address: "{{ .Values.global.keys.vault.address }}"
            mount: "{{ .Values.global.keys.vault.transitMount }}"
            ca_file: "{{ if .Values.global.keys.vault.caCert }}/etc/kista/secrets/cas/vault.crt{{ end }}"
            software_keys: true
            auth:
              kind: kubernetes
              mount: "{{ .Values.global.keys.vault.authMount }}"
              role: "{{ .Values.global.keys.vault.kistaRole }}"
              token_file: /var/run/secrets/kista/vault/token
    # the first setup, once (kista spec 0020 4a, 0024): the tenant, the platform's channel for the node's DuckDB,
    # its key, and the upstreams it mirrors
    bootstrap:
      versions:
        - {version: "{{ .Values.global.duckdbVersion }}", kind: release}
      tenant: {name: hugr}
      channels:
        - name: platform
          kind: signed
          versions: ["{{ .Values.global.duckdbVersion }}"]
          key: "keys:{{ .Values.global.keys.vault.kistaKey }}:v1"
      upstreams: []
