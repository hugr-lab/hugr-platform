# the operator's serving certificate (the node API and the webhook), from cert-manager when the cluster has it -
# otherwise the administrator provides the Secret hugr-platform-tls. The nodes trust it through the platform's
# caBundle: its CA belongs in that ConfigMap.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hugr-platform
spec:
  secretName: hugr-platform-tls
  dnsNames:
  - hugr-platform.hugr.svc
  - hugr-platform.hugr.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: hugr-platform
