# a RoleBinding: the generated role's rights hold in the operator's namespace only
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hugr-platform-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hugr-platform-operator
subjects:
- kind: ServiceAccount
  name: hugr-platform
