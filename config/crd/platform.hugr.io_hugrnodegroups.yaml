      type: integer
    - jsonPath: .status.profile.applied
      name: Applied
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HugrNodeGroup is one pool of nodes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'HugrNodeGroupSpec is one pool of nodes: how many, of which
              size. People edit it with standard tooling.'
            properties:
              doors:
                description: Doors the nodes open. Flight is always open.
                properties:
                  quack:
                    description: Quack opens the quack door beside Flight.
                    type: boolean
                type: object
              drainSeconds:
                description: |-
                  DrainSeconds a stopping node waits for its sessions (HUGR_DRAIN_DEADLINE); the pod's grace is 30 s more.
                  Default 300.
                format: int32
                minimum: 0
                type: integer
              identity:
                description: |-
                  Identity is the group's workload identity in the IdP, federated from the group's ServiceAccount: the
                  nodes' login to tresor.
                properties:
                  clientID:
                    description: ClientID is the identity's client id in the IdP.
                    type: string
                type: object
              platform:
                description: Platform is the HugrPlatform of the namespace the group
                  belongs to.
                minLength: 1
                type: string
              replicas:
                description: Replicas is the number of nodes.
                format: int32
                minimum: 0
                type: integer
              resourceGroup:
                description: 'ResourceGroup is the policy''s resource group the nodes
                  serve (acl_node_group). Default: the group''s name.'
                type: string
              restartedAt:
                description: 'RestartedAt rolls the group when it changes: the console''s
                  restart button, or a kubectl patch.'
                type: string
              size:
                description: Size is one of the platform's sizes, allowed by its plan.
                minLength: 1
                type: string
