                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lost:
                description: Lost lists the nodes whose Lease expired.
                items:
                  type: string
                type: array
              observedGeneration:
                format: int64
                type: integer
              profile:
                description: ProfileStatus is the group's convergence on the cluster
                  profile.
                properties:
                  applied:
                    description: Applied is how many live nodes have applied the target.
                    format: int32
                    type: integer
                  needsRestart:
                    description: NeedsRestart lists the nodes that report an item
                      they can apply only at a restart or a drain.
                    items:
                      type: string
                    type: array
                  target:
                    description: Target is the highest profile version a live node
                      reports.
                    format: int64
                    type: integer
                type: object
              readyReplicas:
                format: int32
                type: integer
              replicas:
                format: int32
                type: integer
              resourceGroupKnown:
                description: 'ResourceGroupKnown says whether the nodes find their
                  resource group in the policy (nil: no node reported).'
