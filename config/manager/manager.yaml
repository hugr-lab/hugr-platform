# the operator: every replica answers HTTP (the node API on 8443, the webhook on 9443, the probes on 8081); the
# leader reconciles
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugr-platform
  labels:
    app.kubernetes.io/part-of: hugr-platform
    app.kubernetes.io/component: operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/part-of: hugr-platform
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: hugr-platform
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: hugr-platform
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operator
        image: ghcr.io/hugr-lab/hugr-platform:dev
        args:
        - --orchestrator-url=https://hugr-platform.hugr.svc:8443
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME                   # the front runs this pod's image (spec 002)
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - {name: node-api, containerPort: 8443}
        - {name: webhook, containerPort: 9443}
        - {name: probes, containerPort: 8081}
        readinessProbe:
          httpGet: {path: /readyz, port: probes}
        livenessProbe:
          httpGet: {path: /healthz, port: probes}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - {name: tls, mountPath: /etc/hugr-platform/tls, readOnly: true}
      volumes:
      - name: tls
        secret:
          secretName: hugr-platform-tls
---
apiVersion: v1
kind: Service
metadata:
  name: hugr-platform
  labels:
    app.kubernetes.io/part-of: hugr-platform
    app.kubernetes.io/component: operator
spec:
  selector:
    app.kubernetes.io/part-of: hugr-platform
    app.kubernetes.io/component: operator
  ports:
  - {name: node-api, port: 8443, targetPort: node-api}
  - {name: webhook, port: 443, targetPort: webhook}
