# spec 001: go vet, staticcheck, the unit tests, envtest (the API server pinned in the Makefile), the image built;
# spec 003: the web console's typecheck, tests, licence gate and build
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Generated code is current
      run: |
        make generate manifests
        git diff --exit-code -- api config
    - name: Vet and staticcheck
      run: make lint
    - name: Unit tests
      run: make test-unit
    - name: envtest
      run: make test-envtest
    - name: Image
      run: docker build -t ghcr.io/hugr-lab/hugr-platform:ci .
  console:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/console/package-lock.json
    - name: Install
      working-directory: web/console
      run: npm ci --no-fund --no-audit
    - name: Typecheck
      working-directory: web/console
      run: npm run typecheck
    - name: Tests
      working-directory: web/console
      run: npm test
    - name: Licence gate
      working-directory: web/console
      run: npm run licenses
    - name: Audit
      working-directory: web/console
      run: npm audit --omit=dev --audit-level=high
    - name: Build
      working-directory: web/console
      run: npm run build
