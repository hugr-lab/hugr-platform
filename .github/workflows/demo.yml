# spec 004: the platform in one cluster - the operator, two groups of hugr-node pods, Keycloak logging the nodes in by
# their ServiceAccount tokens, tresor-server, kista and PostgreSQL - on kind, with the checks of spec 001 and hugr-node
# spec 010. On main, on dispatch and from the release (spec 005), not on every PR: a run takes about half an hour. The
# node's image is built from the assets of hugr-node's latest successful release dry run on main (a dispatch there makes
# one).
name: Demo
on:
  push:
    branches: [main]
  workflow_dispatch:
  # spec 005: the release runs it on the tag's commit before it publishes, and a PR touching the chart or the image
  workflow_call:
concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # hugr-node's dry-run assets: a token that reads hugr-node's Actions - a fine-grained one (Actions: read on
      # hugr-node) in HUGR_NODE_ARTIFACTS_TOKEN if this job's own may not
      GH_TOKEN: ${{ secrets.HUGR_NODE_ARTIFACTS_TOKEN || github.token }}
      # four nodes at once (check 8) on a 4-core runner; the kubelet rounds a request up to whole CPUs (HUGR_POD_CPU 1)
      HUGR_DEMO_NODE_CPU: 250m
      HUGR_DEMO_KEEP: "1"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Tools
      run: |
        go install sigs.k8s.io/kind@v0.33.0
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
    - name: The demo
      # its own limit, under the job's: a hang still leaves the diagnosis its time
      timeout-minutes: 55
      run: test/demo/run.sh kind
    - name: The cluster's state
      if: failure()
      # through the run's own kubeconfig and redaction: the run's secrets and every token blanked
      run: test/demo/run.sh kind diagnose || true
