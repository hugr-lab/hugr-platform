# spec 005: the operator's release. A tag vX.Y.Z publishes the image ghcr.io/hugr-lab/hugr-platform:vX.Y.Z (linux/amd64
# and linux/arm64, an SBOM and provenance, a keyless signature) and the chart
# oci://ghcr.io/hugr-lab/charts/hugr-platform X.Y.Z (its appVersion the tag, so its default image is the tag's; signed
# the same way) - only once the demo on kind has passed through the chart on the tag's commit. A PR that touches the
# chart, the image or these workflows runs the same without publishing: the chart linted and packaged, the image built
# for both platforms and scanned, the demo.
name: Release
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - charts/**
      - Dockerfile
      - .github/workflows/release.yml
      - .github/workflows/demo.yml
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a tag runs to its end
permissions:
  contents: read

jobs:
  chart:
    name: Chart
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        # a tag vX.Y.Z is the chart's X.Y.Z; anything else is a dry run's 0.0.0-<sha>
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "the tag v$v is no semver" >&2; exit 1; }
          else
            v="0.0.0-${GITHUB_SHA::12}"
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
      - name: Lint, render, package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm lint --strict charts/hugr-platform -f charts/hugr-platform/ci/example-values.yaml
          helm template hugr charts/hugr-platform -n hugr -f charts/hugr-platform/ci/example-values.yaml >/dev/null
          helm package charts/hugr-platform --version "$VERSION" --app-version "v$VERSION" -d out
          # the packaged chart's default image is the release's own
          helm show chart "out/hugr-platform-$VERSION.tgz" | grep -qx "appVersion: v$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: out/hugr-platform-*.tgz

  image:
    name: Image (both platforms, scanned)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # the scan: the amd64 image, loaded (a multi-platform build cannot be; the cache makes it cheap) - a HIGH or
      # CRITICAL finding that has a fix fails the run
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hugr-platform:scan
          cache-from: type=gha
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hugr-platform:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  demo:
    name: Demo
    uses: ./.github/workflows/demo.yml
    secrets: inherit

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [chart, image, demo]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign's keyless signature: this workflow's identity, no key
    env:
      VERSION: ${{ needs.chart.outputs.version }}
      IMAGE: ghcr.io/hugr-lab/hugr-platform
      CHARTS: ghcr.io/hugr-lab/charts
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:v${{ env.VERSION }}
          cache-from: type=gha
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: chart
          path: out
      - name: Push and sign the chart
        shell: bash # -eo pipefail: a failed helm push fails the step, tee or not
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "out/hugr-platform-$VERSION.tgz" "oci://$CHARTS" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: //p' push.log)"
          [ -n "$digest" ] || { echo "no digest from helm push" >&2; exit 1; }
          echo "$TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          cosign sign --yes "$CHARTS/hugr-platform@$digest"
          cosign verify "$CHARTS/hugr-platform@$digest" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          {
            echo "### hugr-platform v$VERSION"
            echo "- image: \`$IMAGE:v$VERSION\` (\`$IMAGE_DIGEST\`)"
            echo "- chart: \`oci://$CHARTS/hugr-platform\` $VERSION (\`$digest\`)"
            echo "- signed by \`$IDENTITY\`"
          } >>"$GITHUB_STEP_SUMMARY"
